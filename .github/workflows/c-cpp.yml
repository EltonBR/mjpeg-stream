name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install-deps
      run: ./install-deps.sh
    - name: make
      run: make
    - name: test
      run: make test
    - name: test overlay designer
      run: node --test tools/overlay-designer/tests/*.test.js
